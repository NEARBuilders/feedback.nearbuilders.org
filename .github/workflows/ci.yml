name: CI

# Thin wrapper — the shared implementation lives in the base runtime repo
# (NEARBuilders/everything-dev). This repo owns triggers, secret policy, and
# working directory. The @main ref matches the sync trust model: bos sync
# already tracks the parent's main for all framework-owned files.
on:
  push:
    branches: [main]
    # paths-ignore stays on push only: it gates Deploy (workflow_run). On
    # pull_request a paths-ignored run never reports the required check,
    # which permanently blocks docs-only PRs once branch protection is on.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-ci.yml@main
    with:
      working_directory: .
    secrets: inherit

  # Merge gate for branch protection. Require this check name ("Lint and Type
  # Check") in Settings → Branches — it is child-owned and slash-free, unlike
  # the reusable call, which GitHub renders as "CI / Lint, typecheck, and test"
  # (the callee half cannot be overridden and breaks silently on upstream
  # renames). A reusable job cannot take caller jobs in `needs`, so this gate
  # lives here, not in the shared workflow. Once consumer-regression.yml
  # (everything-dev#368) ships, add that job to `needs` if E2E should gate
  # merges.
  lint-and-typecheck-gate:
    name: Lint and Type Check
    needs: [ci]
    if: always() # a plain needs-skip reports "skipped", not failure
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ci.result }}" = "success"

  # Undeclared-import check (scripts/check-deps.mjs). Local node_modules can
  # mask imports that pnpm's isolated layout fails on at fresh checkout, so
  # this runs against a clean install rather than piggybacking on the shared
  # consumer-ci job, which streams cache from previous runs.
  check-deps:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check undeclared imports
        run: node scripts/check-deps.mjs
