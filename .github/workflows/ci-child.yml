name: Child CI Jobs

# CHILD-OWNED — bos upgrade never rewrites this file (#538). This repo's extra
# CI jobs live here. `ci.yml` (framework-owned) calls this workflow in parallel
# with the pinned reusable `ci` call and includes its result in the merge gate.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Change detection — skip child CI on docs/changeset-only PRs so they don't
  # burn a full install + browser-suite run. Pushes always run (backend-gate
  # parity).
  filter:
    name: Filter changes
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '**.ts'
              - '**.tsx'
              - '**.js'
              - '**.mjs'
              - '**.cjs'
              - '**.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'biome.json'
              - 'bos.app.ts'
              - 'bos.dev.ts'
              - 'api/**'
              - 'ui/**'
              - 'plugins/**'
              - 'tests/**'

  # Self-owned jobs live here. The reusable consumer-ci job only runs
  # lint/typecheck/vitest — it never boots databases or browsers. When this
  # repo gains a browser regression suite (mirroring the base runtime's
  # browser leg: test-database service containers, then the full retained
  # suite against a local `bos dev` stack), it belongs here. Upstream's
  # consumer-regression.yml (everything-dev#368) may cover it once shipped.
